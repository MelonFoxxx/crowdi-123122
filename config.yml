    greetings: ["привіт", "ку", "хай", "o/", "здоров", "прив"]
    unsure: ["хз", "не знаю", "без поняття", "хм хз", "десь бачив але не пам'ятаю"]
    generic: ["лол", "ага", "та", "ну так", "реально", "хах", "мб", "ну хз", "згоден", "по ідеї так"]
    idle: ["хто шо будує?", "нудно трохи", "десь алмази є взагалі", "скоро ресет?", "гг", "в кого є зайві стаки?", "о, ну ок"]
  ru:
    greetings: ["привет", "ку", "хай", "o/", "здарова"]
    unsure: ["хз", "не знаю", "без понятия"]
    generic: ["лол", "ага", "ну да", "реально", "хах", "мб", "согласен"]
